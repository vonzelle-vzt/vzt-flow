[package]
name = "flow-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "flow"
path = "src/main.rs"

[dependencies]
flow-core = { path = "../flow-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
hound = "3.5"
# SIGINT handler for `flow meeting` (Ctrl+C -> graceful stop + summarize).
ctrlc = "3"
# `flow meeting --notes`: needs "now" to reserve the transcript path on the
# CLI thread before `run_with` does (same version pin as flow-core).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
